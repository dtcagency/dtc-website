# Reverse proxy voor de vacaturesite, zodat een iframe same-origin is.
#
# jobs.dtc.agency stuurt op elke response X-Frame-Options: SAMEORIGIN mee
# (gezet door nginx, niet door WordPress - ook statische bestanden krijgen
# hem). Door die site via ons eigen domein te serveren en de header te
# strippen, mag de browser hem wel in een iframe tonen.

SSLProxyEngine on

<Location /jobs-embed/>
    # mod_substitute werkt alleen op ongecomprimeerde HTML
    RequestHeader unset Accept-Encoding

    ProxyPass        https://jobs.dtc.agency/ connectiontimeout=5 timeout=30
    ProxyPassReverse https://jobs.dtc.agency/

    # De framing-restrictie van de bron mag niet doorlekken.
    # Let op: bij proxy-responses komen de upstream-headers in headers_out
    # terecht, dus 'Header unset' ZONDER always is degene die hem echt weghaalt.
    # De always-variant blijft staan voor foutresponses.
    Header unset X-Frame-Options
    Header always unset X-Frame-Options
    Header unset Content-Security-Policy
    Header always unset Content-Security-Policy

    # Deze kopie mag nooit geindexeerd worden; het origineel blijft de
    # vindbare versie
    Header always set X-Robots-Tag "noindex, nofollow"

    # Houd navigatie binnen de iframe: absolute links naar de vacaturesite
    # omschrijven naar het proxypad, anders loopt de browser alsnog tegen de
    # originele header aan zodra iemand doorklikt.
    # AddOutputFilterByType pakt binnen een Location bij proxy-responses niet;
    # de filter moet hier expliciet aangezet worden.
    SetOutputFilter SUBSTITUTE
    # Let op: de n-vlag betekent in mod_substitute "patroon is letterlijke
    # tekst, geen regex". Escapes als \. worden dan letterlijk gezocht en
    # matchen nooit. Dus: n + kaal patroon, geen backslashes.
    Substitute "s|https://jobs.dtc.agency/|/jobs-embed/|in"
</Location>
